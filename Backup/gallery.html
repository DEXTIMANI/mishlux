<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MishLux Updates</title>

<style>
  body {
    background: #0b0b0c;
    color: #dce6f8;
    font-family: "Poppins", sans-serif;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 40px 20px 10px;
    animation: fadeDown 1s ease forwards;
  }

  h1 {
    font-size: 2.4rem;
    color: #cbe3ff;
    margin-bottom: 8px;
  }

  p.subtitle {
    color: #8faed3;
    margin-top: -5px;
    font-size: 1.1rem;
  }

  .updates-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
    padding: 40px 20px 60px;
    max-width: 1200px;
    margin: auto;
  }

  .update-card {
    background: linear-gradient(145deg, #151516, #1b1b1e);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    transform: translateY(20px);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: var(--delay);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .update-card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 10px 25px rgba(52, 126, 255, 0.25);
  }

  .update-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-bottom: 3px solid #347eff;
  }

  .update-content {
    padding: 16px 18px 24px;
    text-align: left;
  }

  .update-content h3 {
    margin: 0;
    color: #9bc3ff;
    font-size: 1.2rem;
    font-weight: 600;
  }

  .update-content p {
    color: #cfcfcf;
    margin-top: 8px;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .refresh-btn {
    background: #347eff;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px auto 50px;
    display: block;
    font-size: 1rem;
    font-weight: 500;
    transition: 0.3s;
  }

  .refresh-btn:hover {
    background: #5daeff;
    transform: scale(1.03);
  }

  .footer {
    text-align: center;
    color: #888;
    font-size: 0.9rem;
    margin: 40px 0 20px;
  }

  /* Animations */
  @keyframes fadeUp {
    from {
      transform: translateY(30px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  @keyframes fadeDown {
    from {
      transform: translateY(-20px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }
</style>
</head>

<body>
  <header>
    <h1>✨ MishLux Updates</h1>
    <p class="subtitle">Latest highlights and fashion inspirations from our collection</p>
  </header>

  <button class="refresh-btn" id="refreshBtn">Refresh Updates</button>

  <section class="updates-section" id="updatesSection"></section>

  <div class="footer">© MishLux 2026 - All Rights Reserved</div>

<script>
const CLOUD_NAME = "da2ucg8ie";
const TAG = "mishlux_updates";
const updatesSection = document.getElementById("updatesSection");

async function loadUpdates() {
  updatesSection.innerHTML = "<p style='width:100%;text-align:center;padding:20px;'>⏳ Loading updates...</p>";

  try {
    const res = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG}.json`);
    if (!res.ok) throw new Error("Could not fetch images.");
    const data = await res.json();
    const resources = data.resources.reverse();

    updatesSection.innerHTML = "";

    if (!resources.length) {
      updatesSection.innerHTML = "<p style='text-align:center;color:#888;margin-top:40px;'>No updates available yet.</p>";
      return;
    }

    resources.forEach((item, i) => {
      const title = item.context?.custom?.caption || 
        item.public_id.split("/").pop().replace(/[-_]/g, " ");
      const desc = item.context?.custom?.alt || 
        "Exclusive MishLux design — where elegance meets innovation.";

      const card = document.createElement("div");
      card.className = "update-card";
      card.style.setProperty("--delay", `${i * 0.15}s`);
      card.innerHTML = `
        <img src="${item.secure_url}" alt="${desc}">
        <div class="update-content">
          <h3>${title}</h3>
          <p>${desc}</p>
        </div>
      `;
      updatesSection.appendChild(card);
    });
  } catch (err) {
    updatesSection.innerHTML = "<p style='color:#f88;text-align:center;'>⚠️ Failed to load updates. Try again later.</p>";
    console.error(err);
  }
}

document.getElementById("refreshBtn").addEventListener("click", loadUpdates);
loadUpdates();
</script>
</body>
</html>
