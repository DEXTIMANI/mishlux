<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MishLux</title>

  <style>
    /* === Base Styles === */
    body {
      margin: 0;
      background: black url('images/pagecover.jpg') center/cover no-repeat;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    h1, h2, h3, p, img, section, .grid-item, nav, .fixed-icons img {
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease-in-out;
    }

    .visible {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      font-size: 60px;
      color: lightblue;
      margin-bottom: 30px;
      transition-delay: 0.3s;
    }

    h2 {
      font-size: 30px;
      margin: 0.5em 0;
    }

    img {
      max-width: 100%;
      border-radius: 10px;
      transform: scale(0.95);
    }

    img.visible {
      transform: scale(1);
    }

    /* === Navigation === */
    nav ul {
      list-style: none;
      padding: 0;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    nav a {
      color: lightblue;
      font-weight: bold;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.3s ease-in-out;
    }

    nav a:hover {
      color: white;
    }

    /* === Product Grid === */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid-item {
      background-color: rgba(0, 0, 0, 0.7);
      color: lightblue;
      padding: 20px;
      border-radius: 40px;
      transition: transform 0.4s ease-in-out, background-color 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
    }

    .grid-item:hover {
      transform: scale(1.05);
      background-color: rgba(30, 30, 30, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    /* === Floating Contact Icons === */
    .fixed-icons {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
      z-index: 1000;
    }

    .fixed-icons img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      transform: translateY(10px) scale(0.8);
      transition: transform 0.4s ease-in-out, opacity 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
    }

    .fixed-icons img.visible {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .fixed-icons img:hover {
      transform: scale(1.15);
      opacity: 1;
      box-shadow: 0 0 12px lightblue;
    }

    /* === About Section === */
    section {
      background: rgba(0, 0, 0, 0.6);
      margin: 40px auto;
      padding: 20px;
      max-width: 700px;
      border-radius: 20px;
    }

    section h3 {
      font-size: 28px;
      color: lightblue;
    }

    section p {
      font-size: 18px;
      line-height: 1.6;
    }

    /* === Responsive Design === */
    @media (max-width: 768px) {
      h1 { font-size: 40px; }
      h2 { font-size: 24px; }
      section p { font-size: 16px; }
      .fixed-icons img {
        width: 45px;
        height: 45px;
      }
    }

    /* === Reduce Motion Preference === */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Floating Contact Icons -->
  <div class="fixed-icons">
    <a href="https://wa.me/+2349122613239" target="_blank" title="Chat on WhatsApp">
      <img src="icons/Whatsapp.jpg" alt="WhatsApp Icon" />
    </a>
    <a href="mailto:mishealekpenyong365@gmail.com" title="Send us an Email">
      <img src="icons/Mail.jpg" alt="Email Icon" />
    </a>
    <a href="https://www.facebook.com/mishael.ekpez" target="_blank" title="Follow on Facebook">
      <img src="icons/Facebook.jpg" alt="Facebook Icon" />
    </a>
  </div>

  <!-- Header -->
  <header>
    <h2>Welcome To</h2>
  </header>

  <!-- Hero Image -->
  <img src="page.jpg" alt="World Of Apparels Showcase" />
<nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
   <div class="grid-container">
     <div class="grid-item">
     <img src="images/mish.png" alt="Manager's Image">

  <h1>What Are We Making Today?</h1>
<div>
<div>
  <!-- Product Grid -->
  <main>
    <div class="grid-container">
      <div class="grid-item">
        <h2>SHIRTS</h2>
        <img src="images/shirt (1).jpeg" alt="Collection of custom shirts" />
      </div>
      <div class="grid-item">
        <h2>TROUSERS</h2>
        <img src="images/trousers.jpeg" alt="Collection of trousers" />
      </div>
      <div class="grid-item">
        <h2>SENATORS</h2>
        <img src="images/senators.jpeg" alt="Custom senator outfits" />
      </div>
      <div class="grid-item">
        <h2>NATIVE</h2>
        <img src="images/native.jpeg" alt="Native traditional wears" />
      </div>
    </div>
  </main>

  <!-- About Section -->
  <footer>
    <section>
      <h3>About Us</h3>
      <p>
        At MishLux, we’re dedicated to giving our clients well-customized,
        mature clothing experiences that make them stand out in any occasion.
      </p>
    </section>
  </footer>

  <script>
    // Animate everything on load
    window.addEventListener('load', () => {
      document.querySelectorAll('h1, h2, h3, p, img, section, .grid-item, nav, .fixed-icons img')
        .forEach(el => {
          el.classList.add('visible');
        });
    });

    // Scroll-triggered reanimation using Intersection Observer
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        } else {
          entry.target.classList.remove('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('h1, h2, h3, p, img, section, .grid-item, nav, .fixed-icons img')
      .forEach(el => observer.observe(el));
  </script>
</body>
</html>
