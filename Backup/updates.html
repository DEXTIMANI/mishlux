<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MishLux Updates</title>

<style>
  body {
    background: #0b0b0c;
    color: #dce6f8;
    font-family: "Poppins", sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
  }

  header {
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    color: #cbe3ff;
  }

  p.subtitle {
    color: #8faed3;
    margin-top: -8px;
  }

  .carousel-container {
    position: relative;
    overflow: hidden;
    max-width: 90%;
    margin: 40px auto;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
  }

  .carousel {
    display: flex;
    transition: transform 1s ease-in-out;
  }

  .slide {
    min-width: 100%;
    box-sizing: border-box;
    position: relative;
  }

  .slide img {
    width: 100%;
    height: 400px;
    object-fit: cover;
    border-bottom: 3px solid #347eff;
  }

  .caption {
    background: rgba(0, 0, 0, 0.6);
    color: #e0ebff;
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 10px;
    text-align: center;
    font-size: 1rem;
  }

  .refresh-btn {
    margin-top: 20px;
    background: #347eff;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
  }

  .refresh-btn:hover {
    background: #5daeff;
  }

  .empty {
    margin-top: 40px;
    color: #999;
  }

  .footer {
    color: #888;
    font-size: 0.9rem;
    margin-top: 60px;
  }
</style>
</head>
<body>
  <header>
    <h1>✨ SAMPLES ✨</h1>
    <p class="subtitle">What's New</p>
  </header>

  <div class="carousel-container">
    <div class="carousel" id="carousel"></div>
  </div>

  <button class="refresh-btn" id="refreshBtn">Refresh Updates</button>

  <p class="empty" id="emptyMsg" style="display:none;">No updates yet — check back later!</p>

  <div class="footer">© MishLux 2026 - All Rights Reserved</div>

<script>
const CLOUD_NAME = "da2ucg8ie";   // your Cloudinary cloud name
const TAG = "mishlux_updates";    // the tag assigned to your uploaded images
const carousel = document.getElementById("carousel");
const emptyMsg = document.getElementById("emptyMsg"); // ✅ corrected ID

// Load images from Cloudinary JSON list
async function loadUpdates() {
  emptyMsg.style.display = "none";
  carousel.innerHTML = "<p style='width:100%;padding:20px;'>⏳ Loading...</p>";

  try {
    const res = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG}.json`);
    if (!res.ok) throw new Error("Failed to fetch images.");

    const data = await res.json();
    const resources = data.resources || [];

    carousel.innerHTML = "";

    if (resources.length === 0) {
      emptyMsg.style.display = "block";
      return;
    }

    // Show latest images first
    resources.reverse().forEach(item => {
      const imgUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${item.public_id}.${item.format}`;
      const slide = document.createElement("div");
      slide.className = "slide";
      slide.innerHTML = `
        <img src="${imgUrl}" alt="MishLux Update">
        <div class="caption">${item.public_id.replace(/[-_]/g, " ")}</div>
      `;
      carousel.appendChild(slide);
    });

    startCarousel();
  } catch (error) {
    console.error("Error loading updates:", error);
    carousel.innerHTML = "<p style='color:#f88;'>⚠️ Could not load updates. Please try again later.</p>";
  }
}

// === Carousel auto slide ===
let index = 0;
let timer;

function startCarousel() {
  const slides = document.querySelectorAll(".slide");
  if (slides.length === 0) return;

  clearInterval(timer);
  index = 0;

  timer = setInterval(() => {
    index = (index + 1) % slides.length;
    carousel.style.transform = `translateX(-${index * 100}%)`;
  }, 4000);
}

// Refresh button
document.getElementById("refreshBtn").addEventListener("click", loadUpdates);

// Load automatically on start
loadUpdates();
</script>
</body>
</html>
