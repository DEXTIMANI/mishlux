<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MishLux Admin Panel</title>

<style>
  body {
    background: #0b0b0c;
    color: #cbe3ff;
    font-family: "Poppins", sans-serif;
    text-align: center;
    padding: 30px;
    margin: 0;
  }

  h1 {
    font-size: 2em;
    color: #cbe3ff;
    margin-bottom: 0;
  }

  p {
    margin-top: 5px;
    font-size: 1em;
    color: #9ab7d8;
  }

  .section-title {
    margin-top: 30px;
    font-size: 1.5em;
    font-weight: 600;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 25px;
    justify-items: center;
    margin-top: 20px;
  }

  .card {
    background: #1c1c22;
    border: 2px solid #3b3b47;
    border-radius: 10px;
    padding: 15px;
    width: 180px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }

  .card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid #2b67e2;
  }

  .label {
    font-weight: 600;
    color: #cbe3ff;
    margin-top: 8px;
  }

  .desc-box {
    width: 100%;
    margin-top: 6px;
    border-radius: 5px;
    border: none;
    padding: 6px;
    font-size: 0.85em;
    background: #2b2b35;
    color: #cbe3ff;
    outline: none;
  }

  .change-btn,
  .delete-btn {
    width: 100%;
    color: #fff;
    font-weight: bold;
    border: none;
    margin-top: 8px;
    cursor: pointer;
    font-size: 0.9em;
    border-radius: 5px;
    padding: 6px 10px;
    transition: 0.3s;
  }

  .change-btn {
    background: #2b67e2;
  }

  .change-btn:hover {
    background: #1d4bbf;
  }

  .delete-btn {
    background: #e23b3b;
  }

  .delete-btn:hover {
    background: #b82323;
  }

  input[type="file"] {
    display: none;
  }

  footer {
    margin-top: 40px;
    font-size: 0.8em;
    color: #888;
  }

  /* === PIN SCREEN === */
  #pinOverlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #0f172a 10%, #000 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.6s ease;
  }

  #pinOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .pin-box {
    background: #1b1b24;
    border: 2px solid #2b67e2;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(43,103,226,0.3);
    text-align: center;
    width: 280px;
  }

  .pin-box h2 {
    margin: 0 0 15px;
    color: #cbe3ff;
  }

  .pin-input {
    font-size: 1.5em;
    text-align: center;
    letter-spacing: 10px;
    background: #0f0f16;
    color: #cbe3ff;
    border: 2px solid #2b67e2;
    border-radius: 8px;
    width: 120px;
    padding: 8px;
    outline: none;
  }

  .pin-btn {
    background: #2b67e2;
    border: none;
    color: #fff;
    font-weight: 600;
    border-radius: 6px;
    padding: 8px 16px;
    margin-top: 15px;
    cursor: pointer;
    transition: 0.3s;
  }

  .pin-btn:hover {
    background: #1d4bbf;
  }

  .pin-error {
    color: #ff6b6b;
    margin-top: 10px;
    font-size: 0.9em;
    min-height: 18px;
  }
</style>
</head>

<body>
  <!-- PIN LOCK OVERLAY -->
  <div id="pinOverlay">
    <div class="pin-box">
      <h2>Enter 4-Digit PIN</h2>
      <input type="password" maxlength="4" id="pinInput" class="pin-input" inputmode="numeric" pattern="[0-9]*" />
      <br>
      <button class="pin-btn" id="pinSubmit">Unlock</button>
      <div class="pin-error" id="pinError"></div>
    </div>
  </div>

  <h1>- Hi, Mish -</h1>
  <p>What are you updating today?</p>

  <!-- What's New Section -->
  <div class="section">
    <div class="section-title">
      What's New <br>
      <span style="font-size:0.8em;">Upload and add short descriptions</span>
    </div>
    <div class="grid" id="newItems"></div>
  </div>

  <!-- Collections Section -->
  <div class="section">
    <div class="section-title">Collections</div>
    <div class="grid" id="collections"></div>
  </div>

  <footer>© MishLux 2026 — Admin Panel</footer>

<script>
  // === PIN CODE PROTECTION ===
  const PIN_CODE = "1234"; // <--- change your 4-digit pin here
  const pinOverlay = document.getElementById("pinOverlay");
  const pinInput = document.getElementById("pinInput");
  const pinError = document.getElementById("pinError");
  const pinSubmit = document.getElementById("pinSubmit");

  function checkPin() {
    const entered = pinInput.value.trim();
    if (entered === PIN_CODE) {
      pinOverlay.classList.add("hidden");
      setTimeout(() => (pinOverlay.style.display = "none"), 600);
    } else {
      pinError.textContent = "Incorrect PIN. Try again.";
      pinInput.value = "";
    }
  }

  pinSubmit.onclick = checkPin;
  pinInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") checkPin();
  });

  window.addEventListener("load", () => pinInput.focus());

  // === CLOUDINARY SETTINGS ===
  const CLOUD_NAME = "da2ucg8ie";
  const UPLOAD_PRESET = "mishlux_public";
  const defaultImage = "https://res.cloudinary.com/demo/image/upload/sample.jpg";

  // === DATA SLOTS ===
  const newItems = [
    { id: "new1", label: "New 1" },
    { id: "new2", label: "New 2" },
    { id: "new3", label: "New 3" },
  ];

  const collections = [
    { id: "shirts", label: "Shirts" },
    { id: "trousers", label: "Trousers" },
    { id: "native", label: "Native" },
    { id: "senator", label: "Senator" },
  ];

  // === CARD CREATOR ===
  const makeCard = (slot) => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = localStorage.getItem(slot.id) || defaultImage;
    img.id = `${slot.id}-img`;

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = slot.label;

    const desc = document.createElement("textarea");
    desc.className = "desc-box";
    desc.placeholder = "Add description...";
    desc.value = localStorage.getItem(`${slot.id}-desc`) || "";
    desc.onchange = () => {
      localStorage.setItem(`${slot.id}-desc`, desc.value);
    };

    const btn = document.createElement("button");
    btn.textContent = "Change Image";
    btn.className = "change-btn";

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete Image";
    delBtn.className = "delete-btn";

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";

    btn.onclick = () => fileInput.click();
    fileInput.onchange = () => uploadImage(fileInput.files[0], slot.id);

    delBtn.onclick = () => deleteImage(slot.id);

    card.appendChild(img);
    card.appendChild(label);
    card.appendChild(desc);
    card.appendChild(btn);
    card.appendChild(delBtn);
    card.appendChild(fileInput);

    return card;
  };

  // === UPLOAD FUNCTION ===
  const uploadImage = async (file, slotId) => {
    if (!file) return;
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);
    formData.append("tags", "mishlux_updates");

    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      const url = data.secure_url;

      if (url) {
        document.getElementById(`${slotId}-img`).src = url;
        localStorage.setItem(slotId, url);
        alert("✅ Upload successful!");
      } else {
        alert("❌ Upload failed: " + (data.error?.message || "Unknown error"));
      }
    } catch (err) {
      alert("❌ Upload failed!");
      console.error(err);
    }
  };

  // === DELETE FUNCTION ===
  async function deleteImage(slotId) {
  const confirmDelete = confirm("Are you sure you want to delete this image?");
  if (!confirmDelete) return;

  const imageUrl = localStorage.getItem(slotId);
  if (!imageUrl) return alert("No image to delete.");

  // Extract public_id from the Cloudinary URL
  const match = imageUrl.match(/upload\/(?:v\d+\/)?(.+)\.[a-z]+$/);
  const publicId = match ? match[1] : null;

  if (!publicId) {
    alert("Couldn't find image ID.");
    return;
  }

  try {
    const res = await fetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        public_id: publicId,
        admin_secret: "yourAdminSecret", // same as in .env
      }),
    });
    const data = await res.json();

    if (data.success) {
      document.getElementById(`${slotId}-img`).src = defaultImage;
      localStorage.removeItem(slotId);
      alert("🗑️ Deleted successfully from Cloudinary!");
    } else {
      alert("❌ Failed to delete: " + (data.message || "Unknown error"));
    }
  } catch (err) {
    console.error(err);
    alert("❌ Network error while deleting.");
  }
}

  // === RENDER EVERYTHING ===
  const newGrid = document.getElementById("newItems");
  const colGrid = document.getElementById("collections");
  newItems.forEach(item => newGrid.appendChild(makeCard(item)));
  collections.forEach(item => colGrid.appendChild(makeCard(item)));
</script>
</body>
</html>
